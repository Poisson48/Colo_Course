# colo-apps.les-crevettes-cevenoles.fr — STUN/TURN (coturn)
# ==========================================================
# Colocé avec le relais Nostr, ntfy, releases, et le STUN meownopoly (:3478).
#
# ⚠️  PORTS DIFFÉRENTS du STUN meownopoly (3478) — NE PAS MODIFIER.
#     Meownopoly utilise déjà le 3478 pour son STUN (jeu + chat).
#
# Ports utilisés par CE coturn :
#     - 3479/udp + 3479/tcp   (STUN + TURN)
#     - 5350/tcp              (TURNS — TURN over TLS)
#     - 50000-50100/udp       (plage relay, 100 ports suffisent)
#
# ⚠️  Ports à ouvrir sur la box :
#     - 3479/udp  3479/tcp
#     - 5350/tcp
#     - 50000-50100/udp

# --- Réseau ---
listening-ip=0.0.0.0
listening-ip=::
listening-port=3479
tls-listening-port=5350

# Relay ports UDP — plage réduite (100 ports) pour limiter les forwards box
min-port=50000
max-port=50100

# --- Authentification ---
# Secret statique partagé avec l'app (pas de base d'utilisateurs)
use-auth-secret
# ⚠️  REMPLACER ce secret par une vraie valeur aléatoire :
#     openssl rand -hex 32
static-auth-secret=CHANGEMI_GENERATE_WITH_openssl_rand_hex_32

# --- Realm = domaine public ---
realm=colo-apps.les-crevettes-cevenoles.fr

# --- TLS (réutilise le certificat Let's Encrypt existant) ---
cert=/etc/letsencrypt/live/colo-apps.les-crevettes-cevenoles.fr/fullchain.pem
pkey=/etc/letsencrypt/live/colo-apps.les-crevettes-cevenoles.fr/privkey.pem
cipher-list="ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256"

# --- Sécurité ---
# Pas de relay ouvert (auth obligatoire)
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Logs
log-file=/var/log/coturn/turnserver.log
simple-log

# PID
pidfile=/var/run/coturn/turnserver.pid

# --- Ne pas casser les autres services ---
# coturn écoute sur 3479/5350, PAS sur 3478 (meownopoly), 80, 443, 7777, 8077
# Pas de conflit possible avec :
#   - STUN meownopoly (:3478)
#   - nginx SNI (:443)
#   - Strfry (:7777)
#   - ntfy (:8077)
#   - Nextcloud (:8083)
#   - Mémoire des Cévennes (:18542)