# Relais Nostr Colo Course — Strfry en local (TLS via nginx hôte).
# Copie opérationnelle dans ~/colocourse-relay (snap Docker n'accède pas à /data/leo).
# Démarrage : docker compose up -d

services:
  strfry:
    image: dockurr/strfry:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - ./data:/app/strfry-db
