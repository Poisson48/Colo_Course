# colo-apps.les-crevettes-cevenoles.fr — relais Nostr Colo Course (WebSocket)
# ----------------------------------------------------------------------------
#   Internet :443 ─▶ stream{} SNI router (/etc/nginx/nginx.conf)
#                      └─ SNI=colo-apps.les-crevettes-cevenoles.fr
#                              ─▶ 127.0.0.1:11443 (ce vhost, terminaison TLS)
#                                      └─ proxy_pass ─▶ 127.0.0.1:7777 (Strfry Docker)
#
# Certificat : certbot DNS-01 (port 80 filtré par la box).

server {
    listen 80;
    server_name colo-apps.les-crevettes-cevenoles.fr;
    return 301 https://$host$request_uri;
}

server {
    # Pas de http2 : WebSocket Nostr exige HTTP/1.1 (Upgrade → 101).
    listen 127.0.0.1:11443 ssl;
    server_name colo-apps.les-crevettes-cevenoles.fr;

    ssl_certificate     /etc/letsencrypt/live/colo-apps.les-crevettes-cevenoles.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colo-apps.les-crevettes-cevenoles.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ntfy — notifications push (veille Android).
    location /ntfy/ {
        proxy_pass http://127.0.0.1:8077/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        client_max_body_size 64k;
    }

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    access_log /var/log/nginx/colo_apps_relay_access.log;
    error_log  /var/log/nginx/colo_apps_relay_error.log;
}
