# Strfry — relais Colo Course (kind 4545 uniquement).
# TLS terminé par nginx sur l'hôte ; Strfry écoute en local dans Docker.

db = "/app/strfry-db/"

events {
    # Photos d'articles : JPEG ~20–30 Ko → événement chiffré ~40–55 Ko.
    # Marge large pour plusieurs tentatives / futurs payloads (défaut strfry 64 Ko
    # refusait des événements ~66–68 Ko).
    maxEventSize = 262144
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 524288

    info {
        name = "Colo Course"
        description = "Relais privé Colo Course (kind 4545, payloads chiffrés)."
        contact = "https://github.com/Poisson48/Colo_Course"
    }

    maxFilterLimit = 500
    maxSubsPerConnection = 200

    writePolicy {
        plugin = "/app/write-policy.py"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
